[project]
name = "customer-segmentation-retention"
version = "0.1.0"
description = "A reproducible churn modeling and retention-segmentation study on the IBM Telco churn dataset."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sreeharsha Kannegundla" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=3.0",
    "lightgbm>=4.6",
    "optuna>=5.0,<5.1",
    "shap>=0.54,<0.55",
    "typer>=0.12",
]

[project.scripts]
churn = "churn.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "churn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=churn --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
